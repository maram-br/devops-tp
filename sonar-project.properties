# ── SonarQube Configuration ────────────────────────────────────────────────
sonar.projectKey=flask-devops-app
sonar.projectName=Flask DevOps App
sonar.projectVersion=1.0

# Sources et tests
sonar.sources=app
sonar.tests=app
sonar.test.inclusions=**/test_*.py

# Couverture de code (généré par pytest-cov)
sonar.python.coverage.reportPaths=coverage.xml

# Exclusions
sonar.exclusions=**/__pycache__/**,**/*.pyc,**/venv/**

# Encodage
sonar.sourceEncoding=UTF-8

# Qualité Gate : la pipeline s'arrête si ce seuil n'est pas atteint
# (configuré côté SonarQube server, pas ici)
